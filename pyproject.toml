[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loadistant-multiturn"
version = "0.1.0"
description = "解析时间标记，排列模型的多轮一致性的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "loadistant" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://loadistant.github.io"
Repository = "https://github.com/loadistant/multiturn"
Issues = "https://github.com/loadistant/multiturn/issues"

[project.scripts]
multiturn = "multiturn:main"

[tool.setuptools]
py-modules = ["multiturn"]
